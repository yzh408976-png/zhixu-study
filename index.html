<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智序 · 科学学习编排引擎</title>
<meta name="description" content="基于认知科学与动机心理学的学习任务编排系统，面向期末、考研、考公复习">
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E6;
  --paper-2:#EFE7D6;
  --card:#FDFBF5;
  --ink:#23272F;
  --ink-soft:#55596a;
  --ink-faint:#8e8fa0;
  --line:#DCD2BC;
  --line-strong:#C9BC9E;
  --cinnabar:#C7391B;
  --cinnabar-deep:#A22D12;
  --cinnabar-wash:#F7E3DC;
  --pine:#2F6B5E;
  --pine-wash:#E2EEE9;
  --gold:#9A7B24;
  --blue:#3A5A8C;
  --shadow:0 1px 0 rgba(35,39,47,.04),0 10px 28px -20px rgba(35,39,47,.35);
  --font-display:"Noto Serif SC","Source Han Serif SC","STZhongsong","SimSun",serif;
  --font-body:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-num:"Consolas","SF Mono",Menlo,monospace;
  --r:10px;
  --r-lg:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);color:var(--ink);background:var(--paper);
  background-image:
    radial-gradient(1100px 480px at 78% -8%,rgba(199,57,27,.055),transparent 62%),
    linear-gradient(rgba(35,39,47,.033) 1px,transparent 1px),
    linear-gradient(90deg,rgba(35,39,47,.033) 1px,transparent 1px);
  background-size:auto,28px 28px,28px 28px;
  min-height:100vh;font-size:15px;line-height:1.65;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px;color:var(--ink)}
::selection{background:var(--cinnabar-wash)}

/* ---------- 布局骨架 ---------- */
#app{display:flex;min-height:100vh}
#sidebar{
  width:232px;flex-shrink:0;border-right:1px solid var(--line);
  padding:26px 18px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;background:rgba(246,241,230,.72);backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.seal{
  width:48px;height:48px;background:var(--cinnabar);color:#FDF8EE;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:900;font-size:26px;
  box-shadow:inset 0 0 0 2px rgba(253,248,238,.35),0 6px 14px -8px rgba(162,45,18,.7);
  transform:rotate(-3deg);
}
.brand-name{font-family:var(--font-display);font-size:21px;font-weight:900;letter-spacing:.12em}
.brand-sub{font-size:11px;color:var(--ink-faint);letter-spacing:.08em;margin-top:-2px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r);
  color:var(--ink-soft);font-size:14.5px;font-weight:500;border:1px solid transparent;
  transition:all .15s;text-align:left;width:100%;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-item:hover{background:var(--card);color:var(--ink)}
.nav-item.active{background:var(--card);color:var(--cinnabar-deep);border-color:var(--line);box-shadow:var(--shadow)}
.nav-item.active svg{stroke:var(--cinnabar)}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px dashed var(--line-strong)}
.streak-chip{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft)}
.streak-n{font-family:var(--font-display);font-weight:900;font-size:22px;color:var(--cinnabar);font-variant-numeric:tabular-nums}
.side-quote{font-size:11.5px;color:var(--ink-faint);margin-top:10px;line-height:1.7;padding-left:2px}

#main{flex:1;min-width:0;padding:34px 42px 60px;max-width:1060px}
.view{display:none;animation:fadeUp .32s ease both}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes stampIn{
  0%{transform:scale(2.4) rotate(-24deg);opacity:0}
  55%{transform:scale(.9) rotate(-9deg);opacity:1}
  75%{transform:scale(1.06) rotate(-9deg)}
  100%{transform:scale(1) rotate(-9deg);opacity:1}
}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.page-title{font-family:var(--font-display);font-size:27px;font-weight:900;letter-spacing:.05em}
.page-sub{color:var(--ink-soft);font-size:13.5px;margin-top:2px}
.rule{height:3px;margin:14px 0 24px;background:linear-gradient(90deg,var(--cinnabar) 0 64px,var(--line) 64px)}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r);
  font-size:14px;font-weight:500;transition:all .15s;border:1px solid transparent;
}
.btn-primary{background:var(--cinnabar);color:#FDF8EE}
.btn-primary:hover{background:var(--cinnabar-deep)}
.btn-ghost{border-color:var(--line-strong);color:var(--ink-soft);background:var(--card)}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-faint)}
.btn-danger{border-color:#E0B4A8;color:var(--cinnabar-deep);background:var(--card)}
.btn-danger:hover{background:var(--cinnabar-wash)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
  padding:2px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-soft);background:var(--paper);
  white-space:nowrap;
}
.tag-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sci-chip{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--pine);
  border:1px dashed #A8C4BB;border-radius:6px;padding:2px 9px;background:var(--pine-wash);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.sci-chip:hover{border-style:solid;color:#1F4A40}
.muted{color:var(--ink-faint);font-size:12.5px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ---------- 今日视图 ---------- */
.today-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.countdown-chip{
  display:inline-flex;align-items:baseline;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:7px 14px;box-shadow:var(--shadow);font-size:13px;color:var(--ink-soft);
}
.countdown-chip b{font-family:var(--font-display);font-size:19px;color:var(--cinnabar);font-variant-numeric:tabular-nums}
.countdown-chip .sub{color:var(--ink-soft)}

.progress-card{padding:18px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:18px}
.progress-main{flex:1;min-width:220px}
.progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.progress-label b{color:var(--ink)}
.progress-bar{height:9px;background:var(--paper-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pine),#3E8A77);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.progress-side{display:flex;gap:10px;flex-wrap:wrap}
.mini-stat{border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;background:var(--paper);text-align:center}
.mini-stat .v{font-family:var(--font-display);font-weight:900;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.mini-stat .k{font-size:11px;color:var(--ink-faint)}
.motto-card{
  border:1px dashed var(--line-strong);border-radius:var(--r);background:linear-gradient(120deg,rgba(199,57,27,.05),rgba(47,107,94,.05));
  padding:12px 18px;font-family:var(--font-display);font-size:15px;color:var(--ink);letter-spacing:.08em;
  display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:18px;
}
.motto-mark{color:var(--cinnabar);font-weight:900}
.motto-src{font-family:var(--font-body);font-size:12px;color:var(--ink-faint);letter-spacing:.02em}
.firstwin{color:var(--pine);border-color:#A8C4BB;background:var(--pine-wash)}

.energy-card{padding:18px 22px 12px;margin-bottom:22px}
.energy-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;flex-wrap:wrap;gap:6px}
.energy-title{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.04em}
.energy-svg{width:100%;height:auto;display:block}

.tl{position:relative}
.tl-row{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:stretch}
.tl-time{text-align:right;font-family:var(--font-num);font-size:12.5px;color:var(--ink-faint);padding-top:16px;line-height:1.5}
.tl-time b{display:block;color:var(--ink-soft);font-weight:600;font-size:13.5px}
.block-card{
  position:relative;border:1px solid var(--line);border-left:4px solid var(--line-strong);
  border-radius:var(--r);background:var(--card);padding:14px 18px;margin-bottom:12px;
  display:flex;gap:14px;align-items:center;cursor:pointer;transition:all .18s;box-shadow:var(--shadow);
}
.block-card:hover{transform:translateX(3px)}
.block-card.done{border-left-color:var(--pine);background:linear-gradient(0deg,rgba(47,107,94,.045),rgba(47,107,94,.045)),var(--card)}
.block-card.done .block-body{opacity:.55}
.block-check{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .18s;background:var(--card);
}
.block-check:hover{border-color:var(--pine);background:var(--pine-wash)}
.block-card.done .block-check{background:var(--pine);border-color:var(--pine)}
.block-card.done .block-check svg{display:block}
.block-check svg{display:none;width:13px;height:13px;stroke:#FDF8EE}
.block-body{flex:1;min-width:0}
.block-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.block-name{font-weight:700;font-size:15px}
.block-sub{font-family:var(--font-num);font-size:12px;color:var(--ink-faint)}
.block-desc{font-size:13.5px;color:var(--ink-soft);margin-bottom:7px}
.block-foot{display:flex;gap:8px;flex-wrap:wrap}
.stamp{
  position:absolute;right:16px;top:50%;margin-top:-24px;width:48px;height:48px;border-radius:8px;
  border:3px solid var(--pine);color:var(--pine);font-family:var(--font-display);font-weight:900;
  display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.15em;
  writing-mode:vertical-rl;opacity:0;pointer-events:none;background:rgba(253,251,245,.6);
}
.block-card.done .stamp{animation:stampIn .45s cubic-bezier(.2,.9,.3,1.2) both}
.gap-row{
  grid-column:2;text-align:center;font-size:12px;color:var(--ink-faint);
  padding:2px 0 12px;letter-spacing:.1em;
}
.gap-row span{border-top:1px dashed var(--line-strong);display:inline-block;padding:4px 18px 0}

.today-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.gen-hero{padding:52px 40px;text-align:center;margin-top:26px}
.gen-hero h2{font-family:var(--font-display);font-size:23px;font-weight:900;letter-spacing:.06em;margin-bottom:10px}
.gen-hero p{color:var(--ink-soft);font-size:14px;max-width:460px;margin:0 auto 26px}
.empty-note{padding:14px 20px;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--ink-soft);font-size:13.5px;margin-top:18px;text-align:center}

/* ---------- 计划视图 ---------- */
.exam-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:26px}
.exam-card{padding:16px 18px;position:relative;overflow:hidden}
.exam-card .ec-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.exam-card .ec-days{font-family:var(--font-display);font-weight:900;font-size:30px;color:var(--cinnabar);margin-top:6px;font-variant-numeric:tabular-nums}
.exam-card .ec-days small{font-size:13px;color:var(--ink-soft);font-weight:500;font-family:var(--font-body)}
.exam-card .ec-date{font-size:12px;color:var(--ink-faint);font-family:var(--font-num)}
.exam-card::after{content:"";position:absolute;right:-14px;top:-14px;width:64px;height:64px;border-radius:50%;background:var(--paper-2);opacity:.6}
.plan-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;color:var(--ink-soft)}
.plan-legend .lg{display:flex;align-items:center;gap:6px}
.plan-day{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center;padding:11px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);margin-bottom:9px}
.plan-day.today-row{border-color:var(--cinnabar);box-shadow:0 0 0 1px var(--cinnabar) inset}
.pd-date{line-height:1.4}
.pd-date b{font-size:14.5px}
.pd-date .pd-sub{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-num)}
.pd-date .pd-today{color:var(--cinnabar);font-size:11px;font-weight:700;letter-spacing:.1em}
.pd-bar{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--paper-2)}
.pd-seg{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#FDF8EE;font-weight:500;min-width:4%;overflow:hidden;white-space:nowrap;transition:flex .3s}
.pd-seg span{padding:0 3px}
.pd-exams{display:flex;gap:6px;flex-wrap:wrap}
.exam-flag{font-size:10.5px;background:var(--cinnabar-wash);color:var(--cinnabar-deep);border-radius:5px;padding:1px 7px;border:1px solid #E4B8AA}

/* ---------- 科目视图 ---------- */
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.sub-card{padding:18px 20px}
.sub-card .sc-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sc-dot{width:13px;height:13px;border-radius:4px;flex-shrink:0}
.sc-name{font-weight:700;font-size:16px;flex:1}
.sc-meta{font-size:12px;color:var(--ink-faint);font-family:var(--font-num);margin-bottom:14px}
.slider-row{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;color:var(--ink-soft)}
.slider-row .sv{font-family:var(--font-num);font-weight:600;color:var(--ink);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--cinnabar);cursor:pointer;box-shadow:0 1px 4px rgba(35,39,47,.25);
}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--card);border:2.5px solid var(--cinnabar);cursor:pointer}
input[type=date],input[type=time],input[type=text]{
  border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:var(--card);outline:none;
}
input:focus{border-color:var(--cinnabar)}
.sc-colors{display:flex;gap:8px;margin:4px 0 12px}
.sc-color{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:transform .12s}
.sc-color:hover{transform:scale(1.12)}
.sc-color.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.sc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.add-card{padding:20px;border-style:dashed;border-color:var(--line-strong);background:transparent}
.add-card h3{font-family:var(--font-display);font-size:16px;margin-bottom:12px}
.add-card .field{margin-bottom:10px}
.add-card label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px}

/* ---------- 习惯视图 ---------- */
.profile-wrap{max-width:640px}
.pf-card{padding:24px 26px;margin-bottom:18px}
.pf-card h3{font-family:var(--font-display);font-size:17px;margin-bottom:16px;letter-spacing:.04em}
.pf-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pf-field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.opt-cards{display:flex;gap:10px;flex-wrap:wrap}
.opt-card{
  border:1.5px solid var(--line-strong);border-radius:var(--r);padding:10px 16px;background:var(--card);
  text-align:left;transition:all .15s;min-width:130px;
}
.opt-card b{display:block;font-size:14px}
.opt-card small{color:var(--ink-faint);font-size:11.5px}
.opt-card.sel{border-color:var(--cinnabar);background:var(--cinnabar-wash)}
.opt-card.sel b{color:var(--cinnabar-deep)}
.hours-line{display:flex;align-items:center;gap:14px}
.hours-line .hv{font-family:var(--font-display);font-weight:900;font-size:21px;color:var(--cinnabar);min-width:74px;font-variant-numeric:tabular-nums}

/* ---------- 科学视图 ---------- */
.sci-intro{padding:20px 24px;margin-bottom:20px;border-left:4px solid var(--cinnabar)}
.sci-intro p{font-size:14px;color:var(--ink-soft)}
.sci-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.sci-card{padding:20px 22px;display:flex;flex-direction:column;gap:9px}
.sci-card h3{font-family:var(--font-display);font-size:16.5px;display:flex;align-items:baseline;gap:9px}
.sci-card h3 .sci-en{font-size:11px;color:var(--ink-faint);font-family:var(--font-body);font-weight:400;letter-spacing:.03em}
.sci-card p{font-size:13.5px;color:var(--ink-soft)}
.sci-apply{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--ink)}
.sci-cite{font-size:11.5px;color:var(--ink-faint);border-top:1px dashed var(--line-strong);padding-top:9px;margin-top:auto;font-style:italic}

/* ---------- AI 教练视图 ---------- */
.ai-status{display:flex;align-items:center;gap:12px;padding:14px 20px;margin-bottom:18px;flex-wrap:wrap}
.ai-dot{width:9px;height:9px;border-radius:50%;background:var(--ink-faint);flex-shrink:0}
.ai-dot.on{background:var(--pine)}
.ai-status .as-txt{flex:1;min-width:180px;font-size:13.5px;color:var(--ink-soft)}
.ai-status .as-txt b{color:var(--ink)}
.coach-grid{display:grid;grid-template-columns:1fr;gap:16px;max-width:780px}
.coach-card{padding:20px 22px}
.coach-card h3{font-family:var(--font-display);font-size:17px;margin-bottom:4px;letter-spacing:.03em;display:flex;align-items:baseline;gap:9px}
.coach-card h3 .cc-en{font-size:11px;color:var(--ink-faint);font-family:var(--font-body);font-weight:400}
.coach-card .cc-sub{font-size:12.5px;color:var(--ink-faint);margin-bottom:14px;line-height:1.6}
.coach-card textarea{
  width:100%;min-height:88px;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;
  background:var(--card);outline:none;font-size:13.5px;resize:vertical;line-height:1.6;font-family:var(--font-body);
}
.coach-card textarea:focus{border-color:var(--cinnabar)}
.cc-actions{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.ai-out{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:14px 16px;font-size:13.5px;color:var(--ink);white-space:pre-wrap;display:none;line-height:1.75}
.ai-out.show{display:block}
.ai-out .ao-head{font-size:11.5px;color:var(--pine);font-weight:700;margin-bottom:8px;letter-spacing:.06em}
.ai-out .ao-err{color:var(--cinnabar-deep)}
.ai-note{font-size:12px;color:var(--ink-faint);margin-top:10px;line-height:1.6}
.thinking{display:inline-flex;gap:5px;align-items:center;padding:4px 0}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}
.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.field-lbl{display:block;font-size:12.5px;color:var(--ink-soft);margin:12px 0 5px}

/* ---------- 账号登录 ---------- */
#auth{position:fixed;inset:0;z-index:85;background:var(--paper);display:flex;align-items:center;justify-content:center;transition:opacity .45s ease,visibility .45s;padding:20px}
#auth.hide{opacity:0;visibility:hidden;pointer-events:none}
.auth-card{width:400px;max-width:100%;padding:30px 32px 24px}
.auth-seal{
  width:44px;height:44px;background:var(--cinnabar);color:#FDF8EE;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:23px;
  margin:0 auto 12px;box-shadow:inset 0 0 0 2px rgba(253,248,238,.35),0 6px 14px -8px rgba(162,45,18,.7);transform:rotate(-3deg);
}
.auth-title{font-family:var(--font-display);font-size:24px;font-weight:900;letter-spacing:.18em;text-indent:.18em;text-align:center}
.auth-sub{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:3px;letter-spacing:.05em}
.auth-tabs{display:flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;margin:18px 0 16px}
.auth-tab{flex:1;padding:9px;font-size:14px;font-weight:500;color:var(--ink-soft);background:var(--card);transition:all .15s;letter-spacing:.2em;text-indent:.2em}
.auth-tab.on{background:var(--cinnabar);color:#FDF8EE}
.auth-field{margin-bottom:12px}
.auth-field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.auth-field input{width:100%}
.auth-err{display:none;font-size:12.5px;color:var(--cinnabar-deep);background:var(--cinnabar-wash);border:1px solid #E4B8AA;border-radius:8px;padding:7px 12px;margin-bottom:12px;line-height:1.6}
.auth-err.show{display:block}
.auth-links{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px;gap:10px;flex-wrap:wrap}
.auth-links button{color:var(--ink-faint);text-decoration:underline dotted}
.auth-links button:hover{color:var(--cinnabar-deep)}
.auth-links .fp-btn{color:var(--cinnabar-deep)}
.pw-rule{font-size:11.5px;color:var(--ink-faint);margin-top:5px;line-height:1.6}
.pw-rule b{color:var(--ink-soft);font-weight:500}
.pw-req{
  font-size:12px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;margin-bottom:14px;line-height:1.7;
}
.pw-req .pw-req-t{font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:2px}
.pw-req ul{margin:0;padding-left:18px}
.pw-req li.done{color:var(--pine)}
.pw-meter{margin-top:8px}
.pw-meter-bar{display:flex;gap:4px;height:5px}
.pw-meter-bar i{flex:1;background:var(--line);border-radius:99px;transition:background .18s ease}
.pw-meter-txt{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:4px}
.pw-meter-txt .pm-label{font-weight:700}
.auth-note{margin-top:16px;font-size:11.5px;color:var(--ink-faint);line-height:1.7;border-top:1px dashed var(--line-strong);padding-top:12px}
.auth-card.auth-flip{animation:authFlip .38s cubic-bezier(.22,.9,.36,1)}
@keyframes authFlip{
  0%{opacity:0;transform:translateX(26px) scale(.985)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}
#acctBox{display:none}
.acct-chip{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-soft);margin-bottom:12px}
.acct-ava{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13.5px;flex-shrink:0;font-family:var(--font-display);font-weight:700;position:relative}
.acct-ava.guest{border:1.5px dashed var(--line-strong);color:var(--ink-faint);background:var(--card)}
.acct-ava.user{background:var(--cinnabar);color:#FDF8EE;box-shadow:0 4px 10px -6px rgba(162,45,18,.8)}
.acct-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-num)}
.acct-chip .acct-act{color:var(--cinnabar-deep);font-size:12px;text-decoration:underline dotted;flex-shrink:0}
.acct-login{
  display:flex;align-items:center;gap:9px;width:calc(100% + 16px);margin:0 -8px;padding:7px 8px;
  border-radius:10px;cursor:pointer;transition:background .16s ease;font-family:var(--font-body);
}
.acct-login:hover,.acct-login:focus-visible{background:var(--cinnabar-wash);outline:none}
.acct-login:hover .acct-ava.guest,.acct-login:focus-visible .acct-ava.guest{border-color:var(--cinnabar);border-style:solid;color:var(--cinnabar-deep)}
.acct-login:hover .acct-txt,.acct-login:focus-visible .acct-txt{color:var(--ink)}
.acct-login .acct-arrow{color:var(--ink-faint);flex-shrink:0;transition:transform .16s ease, color .16s ease}
.acct-login:hover .acct-arrow{transform:translateX(2px);color:var(--cinnabar-deep)}
.acct-ava.guest::after{
  content:'';position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;
  background:var(--cinnabar);border:2px solid var(--paper);animation:acctPulse 2.2s ease-in-out infinite;
}
@keyframes acctPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.45);opacity:.55}}
@media (prefers-reduced-motion: reduce){.acct-ava.guest::after{animation:none}}

/* ---------- 弹窗 / Toast ---------- */
.modal-mask{
  position:fixed;inset:0;background:rgba(35,39,47,.42);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;animation:fadeUp .2s ease;
}
.modal{
  background:var(--card);border:1px solid var(--line-strong);border-radius:var(--r-lg);
  max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:26px 28px;
  box-shadow:0 24px 60px -20px rgba(35,39,47,.5);animation:popIn .25s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal h3{font-family:var(--font-display);font-size:19px;margin-bottom:4px;letter-spacing:.04em}
.modal .m-sub{font-size:12.5px;color:var(--ink-faint);margin-bottom:16px}
.modal .m-body{font-size:14px;color:var(--ink-soft)}
.modal .m-body p{margin-bottom:10px}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.m-sci{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0;background:var(--paper)}
.m-sci .t{font-weight:700;color:var(--pine);font-size:13.5px;margin-bottom:5px}
.m-sci p{font-size:13px}
.m-cite{font-size:11.5px;color:var(--ink-faint);font-style:italic;margin-top:8px}
.why-item{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.why-item:last-child{border-bottom:none}
.why-n{font-family:var(--font-display);font-weight:900;color:var(--cinnabar);font-size:15px}
.why-item b{font-size:14px}
.why-item p{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
#toast-root{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:var(--ink);color:#F4EFDF;padding:10px 22px;border-radius:99px;font-size:13.5px;
  box-shadow:0 10px 30px -10px rgba(35,39,47,.6);animation:toastIn .3s ease;white-space:nowrap;
}
.toast.win{background:var(--pine)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- 引导向导 ---------- */
.ob-steps{display:flex;gap:8px;margin-bottom:18px}
.ob-step{flex:1;height:4px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line)}
.ob-step.on{background:var(--cinnabar);border-color:var(--cinnabar)}
.ob-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ob-type{border:1.5px solid var(--line-strong);border-radius:var(--r);padding:14px 16px;text-align:left;transition:all .15s;background:var(--card)}
.ob-type b{font-family:var(--font-display);font-size:16px;display:block}
.ob-type small{color:var(--ink-faint);font-size:12px}
.ob-type.sel{border-color:var(--cinnabar);background:var(--cinnabar-wash)}
.ob-sub-row{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;background:var(--card)}
.ob-sub-row .osr-head{display:flex;gap:8px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
.ob-sub-row input[type=text]{flex:1;min-width:120px}
.ob-sub-row input[type=date]{flex-shrink:0}

/* ---------- 启动页 ---------- */
#splash{
  position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  transition:opacity .55s ease,visibility .55s;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splashFx{position:absolute;inset:0;width:100%;height:100%}
.sp-inner{position:relative;text-align:center;padding:24px;max-width:560px;animation:spFloat 6s ease-in-out infinite}
@keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion: reduce){.sp-inner{animation:none}}
.sp-seal{
  width:64px;height:64px;background:var(--cinnabar);color:#FDF8EE;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:34px;
  margin:0 auto 20px;box-shadow:inset 0 0 0 2px rgba(253,248,238,.35),0 8px 18px -10px rgba(162,45,18,.7);
}
@keyframes spStampIn{
  0%{transform:scale(2.2) rotate(-22deg);opacity:0}
  60%{transform:scale(.92) rotate(-4deg);opacity:1}
  100%{transform:scale(1) rotate(-4deg);opacity:1}
}
.sp-title{font-family:var(--font-display);font-size:46px;font-weight:900;letter-spacing:.2em;text-indent:.2em;margin:0 0 8px;text-shadow:0 1px 10px rgba(255,255,255,.9)}
.sp-tag{color:var(--cinnabar);letter-spacing:.32em;text-indent:.32em;font-size:14px;font-weight:500;margin-bottom:14px;text-shadow:0 1px 8px rgba(255,255,255,.9)}
.sp-desc{color:var(--ink-soft);font-size:14.5px;line-height:1.8;text-shadow:0 1px 8px rgba(255,255,255,.85)}
.sp-chips{display:flex;gap:10px;justify-content:center;margin:24px 0 28px;flex-wrap:wrap}
.sp-chip{
  border:1px solid rgba(255,255,255,.75);border-radius:999px;padding:5px 16px;font-size:13px;
  color:var(--ink-soft);background:rgba(255,255,255,.55);backdrop-filter:blur(6px);
  box-shadow:0 2px 10px rgba(64,100,120,.08);
}
.sp-enter{font-size:15px;padding:11px 34px}
.sp-inner>*{animation:fadeUp .55s ease both}
.sp-seal{animation:spStampIn .55s .05s both}
.sp-title{animation-delay:.15s}
.sp-tag{animation-delay:.25s}
.sp-desc{animation-delay:.35s}
.sp-chips{animation-delay:.45s}
.sp-enter{animation-delay:.55s}

/* ---------- 移动端 ---------- */
#tabbar{display:none}
@media (max-width:900px){
  #sidebar{display:none}
  .sp-title{font-size:36px}
  .sp-desc{font-size:13.5px}
  #tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(253,251,245,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line-strong);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-faint);padding:6px 2px;border-radius:8px}
  .tab-item svg{width:19px;height:19px}
  .tab-item.active{color:var(--cinnabar-deep)}
  #main{padding:22px 18px 96px}
  .tl-row{grid-template-columns:58px 1fr;gap:9px}
  .plan-day{grid-template-columns:1fr;gap:8px}
  .ob-type-grid{grid-template-columns:1fr}
  .stamp{display:none}
}
</style>
</head>
<body>
<div id="splash">
  <canvas id="splashFx"></canvas>
  <div class="sp-inner">
    <div class="sp-seal">序</div>
    <h1 class="sp-title">智序</h1>
    <p class="sp-tag">科学学习编排引擎</p>
    <p class="sp-desc">认知科学定骨架 · AI 做个性化<br>为期末、考研、考公复习，生成有据可查的每日功课时表</p>
    <div class="sp-chips">
      <span class="sp-chip">9 项实证研究</span>
      <span class="sp-chip">六块式科学时表</span>
      <span class="sp-chip">AI 学习教练</span>
    </div>
    <button class="btn btn-primary sp-enter" data-act="enter-app">进入系统</button>
    
  </div>
</div>
<div id="auth" class="hide"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="seal">序</div>
      <div>
        <div class="brand-name">智序</div>
        <div class="brand-sub">科学学习编排引擎</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
        <div class="acct-chip" id="acctBox"></div>
        <div class="streak-chip">
        <span class="streak-n" id="streakN">0</span>
        <span>天连击</span>
      </div>
    </div>
  </aside>

  <main id="main">
    <section class="view" id="view-today"></section>
    <section class="view" id="view-plan"></section>
    <section class="view" id="view-subjects"></section>
    <section class="view" id="view-profile"></section>
    <section class="view" id="view-coach"></section>
    <section class="view" id="view-science"></section>
  </main>
</div>
<nav id="tabbar"></nav>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
'use strict';
/* ================= 工具 ================= */
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function pad(n){return String(n).length<2?'0'+n:String(n)}
function fmtD(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return fmtD(new Date())}
function parseD(s){return new Date(s+'T00:00:00')}
function addDays(s,n){return fmtD(new Date(parseD(s).getTime()+n*86400000))}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000)}
var WK=['日','一','二','三','四','五','六'];
function wkCN(s){return '周'+WK[parseD(s).getDay()]}
function clamp(v,lo,hi){return Math.min(hi,Math.max(lo,v))}
function hm2min(h){var p=h.split(':');return (+p[0])*60+(+p[1])}
function min2hm(m){m=Math.round(m);return Math.floor(m/60)+':'+pad(m%60)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var PAL=['#C7391B','#2F6B5E','#9A7B24','#3A5A8C','#7B4B94','#8C3A5A'];

/* ================= 科学依据库 ================= */
var SCI={
  selfefficacy:{name:'自我效能感',en:'Self-Efficacy',
    why:'先完成擅长、喜欢的科目制造「首胜」。成功体验是自我效能感最重要的来源，它会提升你对后续困难任务的投入度与坚持性。',
    apply:'今日首个任务安排你最擅长/最喜欢的科目，时长适中、难度不高，目标是快速拿下、积累手感。',
    cite:'Bandura, A. (1977). Self-efficacy: Toward a unifying theory of behavioral change.'},
  progress:{name:'渐进原则',en:'The Progress Principle',
    why:'基于 12,000 篇工作日记的追踪研究发现：对「进展」的感知是内在动机与情绪最强的来源，小事的进展亦有力量。',
    apply:'每完成一个任务块，进度条与连击立即点亮，让进展可见、可感。',
    cite:'Amabile, T. & Kramer, S. (2011). The Progress Principle.'},
  cognitiveload:{name:'认知负荷理论',en:'Cognitive Load Theory',
    why:'工作记忆容量有限。新知识攻坚属于高内在负荷任务，应安排在精力峰值时段，且高负荷块之间需以低负荷任务或休息隔开。',
    apply:'「峰值攻坚」块对齐你的高效时段（可设晨型/夜型），高负荷与低负荷任务交替排布。',
    cite:'Sweller, J. (1988). Cognitive load during problem solving: Effects on learning.'},
  testing:{name:'测试效应',en:'Testing Effect',
    why:'主动检索（闭卷回忆、自测、默写）对长期记忆的巩固远优于反复重读——重读只制造「熟悉感」的错觉。',
    apply:'每日设置「检索自测」块：闭卷默写昨日所学核心概念、公式与框架，再对照订正。',
    cite:'Roediger, H. & Karpicke, J. (2006). Test-enhanced learning: Taking memory tests improves long-term retention.'},
  interleaving:{name:'交错练习',en:'Interleaving',
    why:'在科目/题型之间交替练习，比整块单科刷题更锻炼「识别该用什么方法」的能力——这正是考场上真正的考验。',
    apply:'每日安排两门科目混合出题的「交错练习」块：先判断题型归属，再动笔作答。',
    cite:'Rohrer, D. & Taylor, K. (2007). The shuffling of mathematics problems improves learning.'},
  spacing:{name:'间隔重复',en:'Spaced Repetition',
    why:'遗忘先快后慢（艾宾浩斯遗忘曲线）。分散复习的长期保持显著优于集中突击，且复习间隔应随巩固程度逐渐拉长。',
    apply:'系统按 +1 / +3 / +7 天自动为已学内容排队复习：昨日内容进入检索自测，3/7 天前内容进入间隔复习。',
    cite:'Cepeda, N. et al. (2006). Distributed practice: Effects on learning (meta-analysis of 317 experiments).'},
  zeigarnik:{name:'蔡加尼克效应',en:'Zeigarnik Effect',
    why:'未完成的任务会保持心理张力、更易被记住——适度利用它可以降低次日的启动阻力。',
    apply:'每日收尾时留一道「悬念题」不做完，明天开场直接从它切入，快速进入状态。',
    cite:'Zeigarnik, B. (1927). On finished and unfinished tasks.'},
  sdt:{name:'自我决定理论',en:'Self-Determination Theory',
    why:'自主感与胜任感是内在动机的燃料。尊重个人偏好与节奏的任务编排，比强制统一课表更能维持长期投入。',
    apply:'科目的难度/掌握/喜好、作息、高效时段与节奏全部由你定义，算法据此个性化排序。',
    cite:'Ryan, R. & Deci, E. (2000). Self-determination theory and the facilitation of intrinsic motivation.'},
  egodepletion:{name:'意志力损耗之争',en:'Ego Depletion Debate',
    why:'「先做难任务以防意志力耗尽」的经典理论，在 23 个实验室、2000+ 人的大规模预注册复现中效应接近零，已不足为据。',
    apply:'本系统不采用「先难后易防耗尽」的排序逻辑，而依据紧迫度、掌握度与个人优势科学排序。',
    cite:'Hagger, M. et al. (2016). A multilab preregistered replication of the ego-depletion effect.'}
};
var TYPES={
  opener:{label:'首胜开场',sci:'selfefficacy'},
  peak:{label:'峰值攻坚',sci:'cognitiveload'},
  retrieval:{label:'检索自测',sci:'testing'},
  interleave:{label:'交错练习',sci:'interleaving'},
  review:{label:'间隔复习',sci:'spacing'},
  closer:{label:'悬念收尾',sci:'zeigarnik'}
};

/* ================= 状态 ================= */
var BASE_KEY='zhixu_v1';
var ACCOUNTS_KEY='zhixu_accounts_v1';
var SESSION_KEY='zhixu_session_v1';
function sessionEmail(){
  try{var s=JSON.parse(localStorage.getItem(SESSION_KEY));return(s&&s.email)?String(s.email):null}
  catch(e){return null}
}
function setSession(email){
  if(email)localStorage.setItem(SESSION_KEY,JSON.stringify({email:email,ts:Date.now()}));
  else localStorage.setItem(SESSION_KEY,JSON.stringify({guest:true,ts:Date.now()}));
}
function clearSession(){localStorage.removeItem(SESSION_KEY)}
function dataKey(){var e=sessionEmail();return e?('zhixu_u_'+e):BASE_KEY}
var KEY=dataKey();
var DEF={profile:null,subjects:[],plans:{},completions:{},learnedLog:[],streak:{last:'',n:0},onboarded:false,aiConfig:null};
var state=loadState();
function switchStorage(){KEY=dataKey();state=loadState()}

/* ================= 账号体系（本机账号） ================= */
function sha256Sync(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a))}
  var maxWord=Math.pow(2,32),i,j,result='';
  var words=[],bitLen=ascii.length*8;
  var hash=sha256Sync.h=sha256Sync.h||[];
  var k=sha256Sync.k=sha256Sync.k||[];
  var pc=k.length;
  var isComp={};
  for(var cand=2;pc<64;cand++){
    if(!isComp[cand]){
      for(i=0;i<313;i+=cand)isComp[i]=cand;
      hash[pc]=(Math.pow(cand,.5)*maxWord)|0;
      k[pc++]=(Math.pow(cand,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    j=ascii.charCodeAt(i);
    if(j>>8)return'';
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(bitLen/maxWord)|0;
  words[words.length]=bitLen;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16);
    var oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var t1=hash[7]
        +(rr(e,6)^rr(e,11)^rr(e,25))
        +((e&hash[5])^((~e)&hash[6]))
        +k[i]
        +(w[i]=(i<16?w[i]:(
          w[i-16]
          +(rr(w15,7)^rr(w15,18)^(w15>>>3))
          +w[i-7]
          +(rr(w2,17)^rr(w2,19)^(w2>>>10))
        )|0));
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))
        +((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(i=0;i<8;i++){
    for(j=3;j+1;j--){
      var b=(hash[i]>>(j*8))&255;
      result+=((b<16)?0:'')+b.toString(16);
    }
  }
  return result;
}
function pwHash(pw,salt){return sha256Sync(unescape(encodeURIComponent(salt+'|'+pw)))}
function validateQQEmail(v){return /^[a-zA-Z0-9][a-zA-Z0-9_-]{3,18}@qq\.com$/i.test(String(v||'').trim())}
function validatePw(pw){
  pw=String(pw||'');
  if(pw.length<6)return{ok:false,msg:'密码至少需要 6 个字符'};
  if(!/[a-z]/.test(pw))return{ok:false,msg:'密码需包含小写英文字母'};
  if(!/[A-Z]/.test(pw))return{ok:false,msg:'密码需包含大写英文字母'};
  if(!/[^A-Za-z0-9]/.test(pw))return{ok:false,msg:'密码需包含特殊符号（如 !@#$% 等）'};
  return{ok:true};
}
function pwStrength(pw){
  pw=String(pw||'');
  var rules=[pw.length>=6,/[a-z]/.test(pw),/[A-Z]/.test(pw),/[^A-Za-z0-9]/.test(pw)];
  var n=0;
  for(var i=0;i<rules.length;i++)if(rules[i])n++;
  if(n===0)return{level:0,label:'',color:'#B7B2A6',met:0,ok:false};
  var tierColors=['#C7391B','#9A7B24','#2F6B5E','#3A5A8C'];
  if(pw.length<6)return{level:n,label:'弱 · 不足 6 字符',color:tierColors[0],met:n,ok:false};
  if(n<4){
    var part=['弱','中','较强'][n-1];
    return{level:n,label:part+' · 还差 '+(4-n)+' 项',color:tierColors[n-1],met:n,ok:false};
  }
  var q=0;
  if(pw.length>=8)q++;
  if(pw.length>=12)q++;
  if(/[0-9]/.test(pw))q++;
  if(/[^A-Za-z0-9]{2,}/.test(pw))q++;
  var lbl=q>=4?'极强':(q>=2?'强':'全部达标');
  var col=q>=4?'#3A5A8C':'#2F6B5E';
  return{level:4,label:lbl,color:col,met:4,ok:true};
}

/* ================= 排序引擎 ================= */
function activeSubjects(ref){return state.subjects.filter(function(s){return s.active!==false&&s.examDate>=ref})}
function weights(list,ref){
  var arr=list.map(function(s){
    var d=diffDays(ref,s.examDate);
    var urg=clamp(35/Math.max(d,2),0.4,2.8);
    var weak=(6-s.mastery)/5;
    var pref=1+(s.preference-3)*0.06;
    return{s:s,w:urg*weak*(0.8+s.difficulty*0.08)*pref};
  });
  arr.sort(function(a,b){return b.w-a.w});
  return arr;
}
function allocate(list,ref){
  var ws=weights(list,ref),tot=0,i;
  for(i=0;i<ws.length;i++)tot+=ws[i].w;
  if(!tot)tot=1;
  return ws.map(function(x){return{s:x.s,pct:Math.round(x.w/tot*100)}});
}
function learnedOn(d){return state.learnedLog.filter(function(l){return l.date===d})}
function reviewQueue(ref){
  return state.learnedLog.filter(function(l){
    var dd=diffDays(l.date,ref);
    return dd===3||dd===7;
  });
}
function mkBlock(type,s,units,desc,extraIds){
  return{id:type+'-'+uid(),type:type,subjectId:s.id,units:units,desc:desc,science:TYPES[type].sci,extra:extraIds||[]};
}
function generateDay(dateStr){
  var list=activeSubjects(dateStr);
  if(!list.length)return null;
  var p=state.profile||{};
  var unit=p.rhythm||25,brk=unit===25?5:10;
  var budget=(p.dailyHours||8)*60;
  var maxUnits=Math.max(6,Math.floor(budget/(unit+brk)));
  var ratios={peak:2.6,interleave:2.0,review:1.6,opener:1.4,retrieval:1.4,closer:1.0};
  var totR=0,k;for(k in ratios)totR+=ratios[k];
  var units={},used=0;
  for(k in ratios){units[k]=Math.max(1,Math.floor(maxUnits*ratios[k]/totR));used+=units[k]}
  var rem=maxUnits-used;
  var order=Object.keys(ratios).sort(function(a,b){return ratios[b]-ratios[a]});
  var i=0;while(rem>0){units[order[i%order.length]]++;rem--;i++}

  var ws=weights(list,dateStr);
  var peakS=ws[0].s;
  var openerCand=list.slice().sort(function(a,b){return(b.preference+b.mastery)-(a.preference+a.mastery)});
  var openerS=openerCand[0];
  var interSs=ws.slice(1,3).map(function(x){return x.s});
  while(interSs.length<2)interSs.push(ws[0].s);
  var yLearn=learnedOn(addDays(dateStr,-1));
  var retrIds=[],j;
  for(j=0;j<yLearn.length;j++){if(retrIds.indexOf(yLearn[j].subjectId)<0)retrIds.push(yLearn[j].subjectId)}
  var retrSs=retrIds.map(subjectOf).filter(Boolean);
  var rQueue=reviewQueue(dateStr);
  var weakS=ws[ws.length-1].s;
  var closerS=(weakS.id!==openerS.id)?weakS:ws[Math.min(1,ws.length-1)].s;

  var blocks=[];
  blocks.push(mkBlock('opener',openerS,units.opener,
    openerS.id===peakS.id?'热身练习：中等强度，先拿下再说':'热身练习：'+openerS.name+'（你擅长且喜欢）· 中等强度，先拿下再说'));
  blocks.push(mkBlock('peak',peakS,units.peak,
    '新内容攻坚：'+peakS.name+' 本阶段最重难点，重理解、做笔记，不追求速度'));
  if(retrSs.length){
    var rNames=[],q;for(q=0;q<retrSs.length;q++)rNames.push(retrSs[q].name);
    blocks.push(mkBlock('retrieval',retrSs[0],units.retrieval,
      '闭卷回忆：默写昨日「'+rNames.join('、')+'」的核心概念、公式与框架，再对照订正'));
  }else{
    blocks.push(mkBlock('retrieval',peakS,units.retrieval,
      '快速预检：浏览 '+peakS.name+' 今日攻坚内容，先自测已有掌握程度'));
  }
  var iNames=[];for(q=0;q<interSs.length;q++){if(iNames.indexOf(interSs[q].name)<0)iNames.push(interSs[q].name)}
  blocks.push(mkBlock('interleave',interSs[0],units.interleave,
    '交错练习：'+iNames.join(' × ')+' 混合出题，先判断题型归属，再动笔作答',interSs.map(function(x){return x.id})));
  if(rQueue.length){
    var rvd=[],rvNames=[],m;
    for(m=0;m<rQueue.length;m++){
      if(rvNames.indexOf(rQueue[m].subjectId)<0){rvNames.push(rQueue[m].subjectId);rvd.push(nameOf(rQueue[m].subjectId)+'（'+diffDays(rQueue[m].date,dateStr)+' 天前）')}
    }
    blocks.push(mkBlock('review',subjectOf(rQueue[0].subjectId)||weakS,units.review,
      '间隔复习：回看往期所学 '+rvd.join('、')+'，只回看不重抄，记不起的做标记'));
  }else{
    blocks.push(mkBlock('review',weakS,units.review,
      '错题回顾：'+weakS.name+' 近期错题重做一遍，只重做当时做错的'));
  }
  blocks.push(mkBlock('closer',closerS,units.closer,
    '今日复盘三行笔记 + 留一道「悬念题」不做完，明天开场直接从它切入'));

  var seq=['opener','peak','retrieval','interleave','review','closer'];
  if((p.chronotype||'balanced')==='evening')seq=['opener','retrieval','interleave','peak','review','closer'];
  var ordered=seq.map(function(t){
    for(var n=0;n<blocks.length;n++){if(blocks[n].type===t)return blocks[n]}
    return null;
  }).filter(Boolean);

  var wake=hm2min(p.wake||'07:30');
  var cur=wake+30,sched=[],lunch=false,dinner=false,cnt=0;
  for(i=0;i<ordered.length;i++){
    var b=ordered[i];
    if(!lunch&&cur>=690){sched.push({kind:'meal',label:'午餐 · 饭后小憩',startMin:cur,durMin:60});cur+=60;lunch=true}
    if(!dinner&&cur>=1050){sched.push({kind:'meal',label:'晚餐 · 出门散步',startMin:cur,durMin:50});cur+=50;dinner=true}
    b.startMin=cur;
    b.durMin=b.units*unit+(b.units-1)*brk;
    sched.push(b);
    cur+=b.durMin+brk;cnt++;
    if(cnt===3){sched.push({kind:'break',label:'长休息 · 离开书桌',startMin:cur,durMin:20});cur+=20}
  }
  return{date:dateStr,sched:sched,unit:unit,brk:brk,generatedAt:Date.now()};
}

/* ================= 能量曲线 ================= */
function energyData(chrono){
  if(chrono==='morning')return[[6,35],[8,62],[10,96],[12,56],[14,44],[16,68],[19,58],[21,38],[23,18]];
  if(chrono==='evening')return[[6,18],[9,42],[12,52],[14,46],[16,66],[18,78],[20,96],[22,58],[23,34]];
  return[[6,28],[9,66],[11,82],[13,50],[15,66],[17,56],[19,76],[21,48],[23,24]];
}
function smoothPath(pts){
  if(pts.length<3)return 'M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L');
  var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+='C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}
function energyAt(chrono,min){
  var pts=energyData(chrono),h=min/60;
  if(h<=pts[0][0])return pts[0][1];
  for(var i=0;i<pts.length-1;i++){
    if(h>=pts[i][0]&&h<=pts[i+1][0]){
      var t=(h-pts[i][0])/(pts[i+1][0]-pts[i][0]);
      return pts[i][1]+(pts[i+1][1]-pts[i][1])*t;
    }
  }
  return pts[pts.length-1][1];
}
function energySVG(plan){
  var p=state.profile||{};
  var chrono=p.chronotype||'balanced';
  var pts=energyData(chrono).map(function(pt){
    return[(pt[0]-6)/(23-6)*660+30,170-pt[1]*1.4];
  });
  var curve=smoothPath(pts);
  var area=curve+' L690 170 L30 170 Z';
  var s='<svg class="energy-svg" viewBox="0 0 720 200" role="img" aria-label="全天能量曲线与任务块分布">';
  s+='<defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1">';
  s+='<stop offset="0" stop-color="#C7391B" stop-opacity=".13"/><stop offset="1" stop-color="#C7391B" stop-opacity="0"/>';
  s+='</linearGradient></defs>';
  for(var h=6;h<=23;h+=3){
    var x=(h-6)/(23-6)*660+30;
    s+='<line x1="'+x+'" y1="170" x2="'+x+'" y2="176" stroke="#C9BC9E" stroke-width="1"/>';
    s+='<text x="'+x+'" y="192" text-anchor="middle" font-size="11" fill="#8e8fa0" font-family="Consolas,monospace">'+h+':00</text>';
  }
  s+='<line x1="30" y1="170" x2="690" y2="170" stroke="#DCD2BC" stroke-width="1.5"/>';
  s+='<path d="'+area+'" fill="url(#eg)"/>';
  s+='<path d="'+curve+'" fill="none" stroke="#23272F" stroke-width="2" stroke-linecap="round" opacity=".82"/>';
  var blocks=plan.sched.filter(function(x){return x.type});
  for(var i=0;i<blocks.length;i++){
    var b=blocks[i];
    var x1=(b.startMin/60-6)/(23-6)*660+30;
    var x2=((b.startMin+b.durMin)/60-6)/(23-6)*660+30;
    var mid=(b.startMin+b.durMin/2)/60;
    var y=170-energyAt(chrono,mid*60)*1.4;
    var w=Math.max(x2-x1-3,6);
    var isPeak=b.type==='peak';
    s+='<rect x="'+(x1+1.5).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" width="'+w.toFixed(1)+'" height="10" rx="3"';
    s+=' fill="'+(isPeak?'#C7391B':colorOf(b.subjectId))+'" opacity="'+(isPeak?0.95:0.6)+'" stroke="'+(isPeak?'#A22D12':'none')+'" stroke-width="1.5"/>';
    if(isPeak){
      s+='<text x="'+((x1+x2)/2).toFixed(1)+'" y="'+(y-12).toFixed(1)+'" text-anchor="middle" font-size="11" fill="#A22D12" font-weight="700">攻坚峰值</text>';
    }
  }
  s+='</svg>';
  return s;
}

/* ================= 完成逻辑 ================= */
function doneSet(d){return new Set(state.completions[d]||[])}
function updateStreak(d){
  var st=state.streak;
  if(st.last===d)return;
  if(st.last===addDays(d,-1))st.n++;else st.n=1;
  st.last=d;
}
function toggleDone(dateStr,blockId){
  var plan=state.plans[dateStr];
  if(!plan)return;
  var b=null,i;
  for(i=0;i<plan.sched.length;i++){if(plan.sched[i].id===blockId){b=plan.sched[i];break}}
  if(!b||!b.type)return;
  var arr=state.completions[dateStr]||[];
  var idx=arr.indexOf(blockId);
  if(idx>=0){
    arr.splice(idx,1);
    state.learnedLog=state.learnedLog.filter(function(l){return l.blockId!==blockId});
  }else{
    arr.push(blockId);
    if(b.type==='peak'){
      var exists=false,j;
      for(j=0;j<state.learnedLog.length;j++){if(state.learnedLog[j].blockId===blockId)exists=true}
      if(!exists)state.learnedLog.push({date:dateStr,subjectId:b.subjectId,blockId:blockId,desc:'新学内容'});
    }
    updateStreak(dateStr);
    if(b.type==='opener'){
      toast('今日首胜达成 — 带着这份手感，去啃硬骨头',true);
    }else{
      toast(TYPES[b.type].label+' 已完成');
    }
  }
  state.completions[dateStr]=arr;
  save();
}

function callLLM(sys,user,cb,err){
  var cfg=state.aiConfig;
  if(!cfg||!cfg.key||!cfg.endpoint){err('AI 未配置');return}
  fetch(cfg.endpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body:JSON.stringify({
      model:cfg.model||'ernst-4.5-turbo-128k',
      messages:[{role:'system',content:sys},{role:'user',content:user}],
      temperature:0.6
    })
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(data){
    var txt=data&&data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
    if(txt)cb(String(txt).trim());else err('AI 返回内容为空');
  }).catch(function(e){err('请求失败：'+e.message)});
}
function runAI(f){
  var t=AI_TASKS[f];if(!t)return;
  if(!state.aiConfig||!state.aiConfig.key){toast('请先配置 AI 接口');openAIConfig();return}
  var inp='';
  if(t.ph){
    var ta=$('#aiIn-'+f);
    inp=(ta&&ta.value?ta.value:'').trim();
    if(!inp){toast('先写下你的情况，或点「填入示例」');return}
  }
  var out=$('#aiOut-'+f);
  if(!out)return;
  out.classList.add('show');
  out.innerHTML='<div class="ao-head">AI 教练思考中</div><div class="thinking"><i></i><i></i><i></i></div>';
  callLLM(AI_SYS,t.build(inp),function(txt){
    out.innerHTML='<div class="ao-head">AI 教练</div>'+esc(txt);
  },function(msg){
    out.innerHTML='<div class="ao-head ao-err">请求失败</div>'+esc(msg)+
      '<div class="ai-note">请检查 API 地址、Key 与模型名是否正确；浏览器直连部分接口可能受跨域（CORS）限制，可换用支持 CORS 的兼容端点。</div>';
  });
}

document.addEventListener('click',function(e){

  }

    e.stopPropagation();

      var isDone=doneSet(d).has(el.getAttribute('data-id'));

    return;

    toggleDone(d,el.getAttribute('data-id'));
    closeModal();renderToday();return;
  }

    renderOb();return;

function renderTodayProgress(){
  var d=today();
  var plan=state.plans[d];if(!plan)return;
  var done=doneSet(d);
  var study=plan.sched.filter(function(x){return x.type});
  var totU=0,dU=0,i;
  for(i=0;i<study.length;i++){totU+=study[i].units;if(done.has(study[i].id))dU+=study[i].units}
  var pct=totU?Math.round(dU/totU*100):0;
  var lbl=$('.progress-label');
  if(lbl){
    lbl.innerHTML='今日进度 <b class="num">'+dU+' / '+totU+'</b> 个学习单元（'+plan.unit+' 分钟/单元）<span class="num" style="float:right">'+pct+'%</span>';
  }
  var fill=$('.progress-fill');
  if(fill)fill.style.width=pct+'%';
  var openerDone=false;
  for(i=0;i<study.length;i++){if(study[i].type==='opener'&&done.has(study[i].id))openerDone=true}
  var stats=$$('.progress-side .mini-stat');
  if(stats.length>1)stats[1].className='mini-stat'+(openerDone?' firstwin':'');
  var st=$('.mini-stat .v');
  if(st)st.textContent=state.streak.n;
}

function spBindMouse(el){
  if(spMouse.bound||!el||typeof el.addEventListener!=='function')return;
  spMouse.bound=true;
  el.addEventListener('mousemove',function(e){
    spMouse.x=e.clientX;spMouse.y=e.clientY;spMouse.active=true;
  });
  el.addEventListener('mouseleave',function(){spMouse.active=false});
  el.addEventListener('touchmove',function(e){
    if(e.touches&&e.touches[0]){spMouse.x=e.touches[0].clientX;spMouse.y=e.touches[0].clientY;spMouse.active=true}
  },{passive:true});
  el.addEventListener('touchend',function(){spMouse.active=false},{passive:true});
}

  {amp:26,len:0.0038,speed:0.42,yBase:0.58,alpha:0.34,glint:0.6},
  {amp:22,len:0.0059,speed:-0.3,yBase:0.66,alpha:0.4,glint:0.75},
  {amp:34,len:0.0026,speed:0.26,yBase:0.76,alpha:0.48,glint:0.9},
  {amp:20,len:0.0072,speed:-0.5,yBase:0.86,alpha:0.58,glint:1.0},
  {amp:28,len:0.0044,speed:0.34,yBase:0.95,alpha:0.7,glint:1.0}
];
var SP_SPARKLES=null;
function spSparkleField(w,h){
  if(SP_SPARKLES&&SP_SPARKLES.w===w&&SP_SPARKLES.h===h)return SP_SPARKLES.list;
  var n=clamp(Math.round(w*h/8000),90,260),arr=[],i;
  for(i=0;i<n;i++){
    arr.push({
      x:Math.random()*w,
      yr:0.56+Math.random()*0.42,
      ph:Math.random()*6.2832,
      fr:0.8+Math.random()*2.2,
      sz:0.8+Math.random()*1.9
    });
  }
  SP_SPARKLES={w:w,h:h,list:arr};
  return arr;
}
function spWaveY(wv,x,t){
  var main=Math.sin(x*wv.len-t*wv.speed);
  var sec=Math.sin(x*wv.len*2.7+t*wv.speed*1.9+1.3);
  var ter=Math.sin(x*wv.len*5.3-t*wv.speed*2.6+4.1);
  return wv.yBase+(main+sec*0.42+ter*0.18)*wv.amp*0.01;
}
function spWaveSlope(wv,x,t){
  var d=2;
  return (spWaveY(wv,x+d,t)-spWaveY(wv,x-d,t))/(2*d);
}
function spDrawWaves(ctx,w,h,t){
  var i,j;
  for(i=0;i<SP_WAVES.length;i++){
    var wv=SP_WAVES[i];
    var seg=Math.max(14,Math.round(w/44));
    ctx.beginPath();
    for(j=0;j<=seg;j++){
      var x=w*j/seg;
      var y=spWaveY(wv,x,t)*h;
      if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();
    var g=ctx.createLinearGradient(0,h*(wv.yBase-0.06),0,h);
    g.addColorStop(0,'rgba(88,138,162,'+(wv.alpha*0.62)+')');
    g.addColorStop(0.45,'rgba(116,168,186,'+(wv.alpha*0.4)+')');
    g.addColorStop(1,'rgba(150,196,208,'+(wv.alpha*0.26)+')');
    ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();
    var glintSeg=Math.max(30,Math.round(w/16));
    var pen=false;
    for(j=0;j<=glintSeg;j++){
      var gx=w*j/glintSeg;
      var slope=spWaveSlope(wv,gx,t);
      var facing=slope<0;
      if(facing){
        var gy=spWaveY(wv,gx,t)*h;
        if(!pen){ctx.moveTo(gx,gy);pen=true}
        else ctx.lineTo(gx,gy);
      }else pen=false;
    }
    ctx.strokeStyle='rgba(255,255,255,'+(0.32*wv.glint)+')';
    ctx.lineWidth=1.6;
    ctx.lineCap='round';
    ctx.stroke();
  }
}
function spDrawSparkles(ctx,w,h,t){
  var list=spSparkleField(w,h),i;
  for(i=0;i<list.length;i++){
    var s=list[i];
    var wv=SP_WAVES[(i*7+3)%SP_WAVES.length];
    var yv=spWaveY(wv,s.x,t);
    if(yv>s.yr)continue;
    var crest=1-Math.min(1,Math.abs(s.yr-yv)*9);
    var tw=Math.max(0,Math.sin(t*s.fr+s.ph));
    if(tw<0.5)continue;
    var a=(tw-0.5)/0.5*(0.35+0.65*crest);
    var y=s.yr*h+Math.sin(t*0.8+s.ph)*3;
    ctx.fillStyle='rgba(255,255,255,'+(0.62*a).toFixed(3)+')';
    ctx.beginPath();ctx.arc(s.x,y,s.sz,0,6.2832);ctx.fill();
  }
}
function spChaseForce(p,dx,dy){
  var d=Math.sqrt(dx*dx+dy*dy);
  if(d>SP_CHASE_R||d<0.0001)return null;
  var tr=16+p.r*2.2;
  var nx=dx/d,ny=dy/d;
  var k=Math.max(-0.32,Math.min(0.32,(d-tr)*0.045));
  var tang=0.03;
  return[nx*k-ny*tang,ny*k+nx*tang];
}
function spSprites(){
  var arr=[],i;
  for(i=0;i<SPLASH_COLORS.length;i++){
    var c=document.createElement('canvas');c.width=48;c.height=48;
    var g=c.getContext('2d');
    if(!g)return arr;
    var grad=g.createRadialGradient(24,24,0,24,24,24);
    grad.addColorStop(0,'rgba('+SPLASH_COLORS[i].join(',')+',0.9)');
    grad.addColorStop(0.32,'rgba('+SPLASH_COLORS[i].join(',')+',0.32)');
    grad.addColorStop(1,'rgba('+SPLASH_COLORS[i].join(',')+',0)');
    g.fillStyle=grad;g.fillRect(0,0,48,48);
    arr.push(c);
  }
  return arr;
}
function spAngle(x,y,t){
  return Math.sin(x*0.0015+t*0.3)*1.5+Math.cos(y*0.0012-t*0.23)*1.5+Math.sin((x+y)*0.0007+t*0.17)*0.8;
}
function spDustCount(w,h){return clamp(Math.round(w*h/13000),56,170)}
var SP_METEOR_MAX=3;
function spMeteorSpawn(w,h){
  var dir=Math.random()<0.5?1:-1;
  var ang=(22+Math.random()*24)*Math.PI/180;
  var sp=340+Math.random()*200;
  return{
    x:dir>0?-60-Math.random()*80:w+60+Math.random()*80,
    y:-40+Math.random()*h*0.45,
    vx:Math.cos(ang)*sp*dir,vy:Math.sin(ang)*sp,
    len:90+Math.random()*80,
    life:0,maxLife:1.1+Math.random()*0.9,
    ci:Math.floor(Math.random()*SPLASH_COLORS.length)
  };
}
function spMeteorStep(m,dt){
  m.life+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;
}
function spMeteorAlive(m,w,h){
  if(!m||m.life>=m.maxLife)return false;
  var mgn=m.len+80;
  return m.x>-mgn&&m.x<w+mgn&&m.y>-mgn&&m.y<h+mgn;
}
function spMeteorAlpha(m){
  var f=Math.min(Math.max(m.life/m.maxLife,0),1);
  return Math.sin(f*Math.PI);
}
function spMeteorDraw(ctx,m){
  var al=spMeteorAlpha(m);
  if(al<=0.004)return;
  var c=SPLASH_COLORS[m.ci];
  var v=Math.sqrt(m.vx*m.vx+m.vy*m.vy)||1;
  var x0=m.x,y0=m.y,x1=m.x-m.vx/v*m.len,y1=m.y-m.vy/v*m.len;
  var grad=ctx.createLinearGradient(x0,y0,x1,y1);
  grad.addColorStop(0,'rgba('+c.join(',')+','+(0.62*al).toFixed(3)+')');
  grad.addColorStop(1,'rgba('+c.join(',')+',0)');
  ctx.strokeStyle=grad;ctx.lineCap='round';
  ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
  ctx.lineWidth=7;ctx.globalAlpha=0.28*al;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
  ctx.globalAlpha=1;
  var hg=ctx.createRadialGradient(x0,y0,0,x0,y0,7);
  hg.addColorStop(0,'rgba(253,250,242,'+(0.95*al).toFixed(3)+')');
  hg.addColorStop(0.4,'rgba('+c.join(',')+','+(0.5*al).toFixed(3)+')');
  hg.addColorStop(1,'rgba('+c.join(',')+',0)');
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(x0,y0,7,0,6.2832);ctx.fill();
}
function spDrawDust(ctx,ps,sprites){
  var j;
  for(j=0;j<ps.length;j++){
    var p=ps[j];
    ctx.globalAlpha=p.a;
    ctx.drawImage(sprites[p.ci],p.x-p.r,p.y-p.r,p.r*2,p.r*2);
  }
  ctx.globalAlpha=1;
}
function spDrawRipples(ctx,w,h,t){
  if(!spMouse.active)return;
  var mx=spMouse.x,my=spMouse.y;
  var i,j;
  for(i=0;i<3;i++){
    var rr=((t*0.5+i*0.66)%1);
    var rad=40+rr*130;
    var al=(1-rr)*0.28;
    ctx.strokeStyle='rgba(255,255,255,'+al.toFixed(3)+')';
    ctx.lineWidth=1.4;
    ctx.beginPath();
    var seg=44;var ok=false;
    for(j=0;j<=seg;j++){
      var ang=6.2832*j/seg;
      var x=mx+Math.cos(ang)*rad,y=my+Math.sin(ang)*rad*0.62;
      if(x<-10||x>w+10||y<-10||y>h+10){ok=false;continue}
      if(!ok){ctx.moveTo(x,y);ok=true}
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,255,255,0.32)';
  ctx.lineWidth=1.6;
  ctx.beginPath();ctx.arc(mx,my,26,0,6.2832);ctx.stroke();
}
function showSplash(){
  var el=$('#splash'),cv=$('#splashFx');
  if(!el||!cv)return;
  el.classList.remove('hide');
  var ctx=cv.getContext?cv.getContext('2d'):null;
  if(!ctx)return;
  spBindMouse(el);
  var w=window.innerWidth||el.clientWidth||0,h=window.innerHeight||el.clientHeight||0;
  if(!w||!h)return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=w*dpr;cv.height=h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var skyGrad=ctx.createLinearGradient(0,0,0,h);
  skyGrad.addColorStop(0,'#FDFBF6');
  skyGrad.addColorStop(0.5,'#EAF3F2');
  skyGrad.addColorStop(1,'#D7E9EA');
  var sprites=spSprites();
  var useSprites=sprites.length>0;
  var ps=[],i;
  if(useSprites){
    var n=spDustCount(w,h);
    for(i=0;i<n;i++){
      ps.push({
        x:Math.random()*w,y:Math.random()*h,
        r:6+Math.random()*14,
        vx:0,vy:0,
        a:0.26+Math.random()*0.36,
        ci:Math.floor(Math.random()*sprites.length)
      });
    }
  }
  var meteors=[],nextMeteor=1.2,lastTs=0;
  function draw(t){
    ctx.fillStyle=skyGrad;ctx.fillRect(0,0,w,h);
    spDrawWaves(ctx,w,h,t);
    spDrawSparkles(ctx,w,h,t);
    if(useSprites)spDrawDust(ctx,ps,sprites);
    for(var mj=0;mj<meteors.length;mj++)spMeteorDraw(ctx,meteors[mj]);
    spDrawRipples(ctx,w,h,t);
  }
  function step(ts){
    if(!splashRun)return;
    var t=ts/1000;
    var dt=lastTs?Math.min((ts-lastTs)/1000,0.05):0.016;lastTs=ts;
    if(t>=nextMeteor&&meteors.length<SP_METEOR_MAX){
      meteors.push(spMeteorSpawn(w,h));
      nextMeteor=t+1.8+Math.random()*3.2;
    }
    for(var mj2=meteors.length-1;mj2>=0;mj2--){
      spMeteorStep(meteors[mj2],dt);
      if(!spMeteorAlive(meteors[mj2],w,h))meteors.splice(mj2,1);
    }
    for(var j=0;j<ps.length;j++){
      var p=ps[j];
      var ang=spAngle(p.x,p.y,t);
      p.vx+=Math.cos(ang)*0.012;p.vy+=Math.sin(ang)*0.012;
      if(spMouse.active){
        var cf=spChaseForce(p,spMouse.x-p.x,spMouse.y-p.y);
        if(cf){p.vx+=cf[0];p.vy+=cf[1]}
      }
      p.vx*=0.97;p.vy*=0.97;
      var spd=p.vx*p.vx+p.vy*p.vy;
      if(spd>36){var sc=6/Math.sqrt(spd);p.vx*=sc;p.vy*=sc}
      p.x+=p.vx+Math.sin(t*0.6+p.r)*0.04;
      p.y+=p.vy+Math.cos(t*0.5+p.a*9)*0.04;
      if(p.x<-p.r)p.x=w+p.r;else if(p.x>w+p.r)p.x=-p.r;
      if(p.y<-p.r)p.y=h+p.r;else if(p.y>h+p.r)p.y=-p.r;
    }
    draw(t);
    splashRaf=requestAnimationFrame(step);
  }
  splashRun=true;
  var reduce=typeof window.matchMedia==='function'&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||typeof requestAnimationFrame!=='function'){draw(0);splashRun=false;return}
  splashRaf=requestAnimationFrame(step);
}
function hideSplash(){
  splashRun=false;
  spMouse.active=false;
  if(splashRaf&&typeof cancelAnimationFrame==='function')cancelAnimationFrame(splashRaf);
  var el=$('#splash');
  if(el)el.classList.add('hide');
}
function enterApp(){
  hideSplash();
  if(!sessionEmail()){showAuth('login');return}
  if(!state.onboarded)setTimeout(openOnboarding,380);
}

/* ================= 启动 ================= */
function boot(){
  renderNav();
  switchView('today');
  showSplash();
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!=='Escape')return;
  var el=$('#splash');
  if(el&&el.classList&&el.classList.contains&&!el.classList.contains('hide')){enterApp();return}
  if(e.key!=='Enter')return;
  var au=$('#auth');
  if(au&&au.classList&&au.classList.contains&&!au.classList.contains('hide')){
    if(authMode==='forgot')resetPw();
    else authSubmit();
  }
});
boot();
</script>
